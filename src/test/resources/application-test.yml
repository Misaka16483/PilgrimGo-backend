# 测试环境配置 - 完全隔离
spring:
  # 使用H2内存数据库，完全隔离生产数据
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    schema: classpath:schema.sql

  # H2控制台（仅测试环境可用）
  h2:
    console:
      enabled: true
      path: /h2-console

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（测试专用密钥）
jwt:
  secret: "test-only-jwt-signing-key-32-bytes-minimum"
  expiration: 3600000  # 1小时

# 短信服务（Mock模式）
sms:
  mock:
    enabled: true
  aliyun:
    access-key-id: "test-only-access-key-id"
    access-key-secret: "test-only-access-key-secret"

# 日志配置
logging:
  level:
    com.misaka.demo: DEBUG
    org.springframework.security: DEBUG
