spring.application.name=pilgrimgo
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://8.130.160.51:5432/BJTU2026  
spring.datasource.username=BJTU2026
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Druid
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=20
spring.datasource.druid.min-idle=5

# MyBatis-Plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# 阿里云 OSS（转折点图片直传）
# 主账号或拥有 sts:AssumeRole 权限的 RAM 用户的 AccessKey
oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}
# RAM 角色 ARN，形如 acs:ram::1234567890:role/PilgrimGoOssUploader
oss.role-arn=acs:ram::1106095563163216:user/power-application-user
oss.role-session-name=pilgrimgo-waypoint
# bucket 与区域
oss.bucket=xunli-go
oss.region=cn-beijing
oss.endpoint=https://oss-cn-beijing.aliyuncs.com
# STS endpoint，固定写法
oss.sts-endpoint=sts.cn-beijing.aliyuncs.com
# 上传路径前缀，最终 key = {prefix}/{userId}/{uuid}.jpg
oss.path-prefix=waypoints
# 临时凭证有效期（秒），最小 900，最大 3600
oss.duration-seconds=3600

# 阿里云 SMS 短信验证码
aliyun.sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID}
aliyun.sms.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET}
aliyun.sms.endpoint=dypnsapi.aliyuncs.com
aliyun.sms.region-id=cn-hangzhou
aliyun.sms.sign-name=速通互联验证码
aliyun.sms.template-code=100001

# Python 融合图微服务（运行前需先启动 pythonService/fusion_service.py）
fusion.python-service-url=http://localhost:5001
